<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Важное сообщение ❤️</title>

<style>

body{
margin:0;
min-height:100vh;
background:linear-gradient(#ffe6f0,#fff);
font-family:Georgia,serif;
text-align:center;
overflow:hidden;
color:#9b2855;
}


h1{
margin-top:50px;
font-size:38px;
}


.envelope{
width:300px;
height:200px;
background:#f7b6ce;
margin:50px auto 30px;
border-radius:15px;
position:relative;
box-shadow:0 15px 30px #aaa;
}


.envelope:before{
content:"";
position:absolute;
top:0;
left:0;
border-left:150px solid transparent;
border-right:150px solid transparent;
border-top:100px solid #ee8fb2;
}


.text{
position:absolute;
top:75px;
width:100%;
font-size:22px;
font-weight:bold;
z-index:2;
color:white;
}


button{
padding:18px 35px;
border:none;
border-radius:30px;
font-size:22px;
cursor:pointer;
margin:15px;
color:white;
}


.open{
background:#e91e63;
}


.yes{
background:#d4af37;
}


.no{
background:#b30000;
}



.card{
display:none;
background:white;
padding:35px;
width:80%;
max-width:500px;
margin:30px auto;
border-radius:25px;
box-shadow:0 10px 30px #aaa;
font-size:28px;
}


.big{
font-size:45px;
color:#e91e63;
}


.cat{
width:300px;
border-radius:20px;
}


.explosion{
animation:shake .5s infinite;
background:white;
}


@keyframes shake{

0%{transform:translate(5px,5px)}
25%{transform:translate(-5px,5px)}
50%{transform:translate(5px,-5px)}
75%{transform:translate(-5px,-5px)}
100%{transform:translate(0)}

}


</style>

</head>


<body>


<div id="main">

<h1>У меня есть кое-что важное...... ❤️</h1>


<div class="envelope">

<div class="text">
Мне нужно сказать тебе<br>
что-то важное......
</div>

</div>


<button class="open" onclick="question()">
Посмотреть важное 💌
</button>


</div>



<div id="question" class="card">

<h2>
Вы уверены, что хотите посмотреть? 🤨
</h2>


<button class="yes" onclick="love()">
Принято, моя королева 👑
</button>


<button class="no" onclick="errorPage()">
Пока не время 😈
</button>


</div>



<div id="love" class="card">

<div class="big">
❤️
</div>


<h2>
Важное сообщение:
</h2>


<p>
Купить колье ❤️💍
</p>


<p>
Спасибо за понимание 😌
</p>


</div>



<div id="error" class="card">

<img class="cat" src="IMG_0881.jpeg">


<h2>
Сайт временно отключён 😂
</h2>


<p>
Причина:<br>
<strong>
недостаточно романтики 💔😂
</strong>
</p>


</div>



<script>


function question(){

document.getElementById("main").style.display="none";
document.getElementById("question").style.display="block";

}



function love(){

document.getElementById("question").style.display="none";
document.getElementById("love").style.display="block";

}



function errorPage(){

document.body.classList.add("explosion");

setTimeout(()=>{

document.getElementById("question").style.display="none";
document.getElementById("error").style.display="block";

},1500);

}


</script>


</body>
</html>
