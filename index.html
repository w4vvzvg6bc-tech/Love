<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Love</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:white;
    font-family: Arial, sans-serif;
}


.scene {
    width:100vw;
    height:100vh;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* ФОН */

.background {

    position:absolute;
    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    animation:
    backgroundShow 2s ease forwards,
    slowMove 15s infinite alternate ease-in-out;

}


@keyframes backgroundShow {

from{
opacity:0;
}

to{
opacity:1;
}

}


@keyframes slowMove {

from{
transform:scale(1);
}

to{
transform:scale(1.05);
}

}



/* МАРТЫШКА */


.monkey {

    position:absolute;

    width:350px;

    max-width:40vw;

    opacity:0;

    transform:translateY(120px) scale(0.8);

    animation:monkeyShow 1.5s ease forwards;

    animation-delay:5s;

    filter:drop-shadow(0 15px 20px rgba(0,0,0,0.25));

}



@keyframes monkeyShow {


0%{

opacity:0;

transform:
translateY(120px)
scale(0.8);

}


100%{

opacity:1;

transform:
translateY(0)
scale(1);

}


}



/* ТЕКСТ */


.text {


position:absolute;

bottom:15%;

font-size:55px;

font-weight:700;

color:white;

text-shadow:
0 5px 15px rgba(0,0,0,0.5);


opacity:0;

animation:textShow 1s ease forwards;

animation-delay:6s;


}


@keyframes textShow {


from{

opacity:0;

transform:translateY(40px);

}


to{

opacity:1;

transform:translateY(0);

}


}



</style>

</head>


<body>


<div class="scene">


<img class="background" src="IMG_0897.jpeg">


<img class="monkey" src="1F6CCEBF-BE7C-4DA8-BAF6-85FB6D24DD93.gif">


<div class="text">
Это ты
</div>


</div>


</body>
</html>
