<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Наша история ❤️</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Georgia,serif;
color:white;
text-align:center;
background:#050510;
}


.sky{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(#050510,#15152b);
z-index:-2;
}


.flash{
position:fixed;
width:100%;
height:100%;
background:white;
opacity:0;
animation:lightning 6s infinite;
z-index:-1;
}


@keyframes lightning{

0%,92%,100%{
opacity:0;
}

93%{
opacity:.9;
}

94%{
opacity:0;
}

96%{
opacity:.7;
}

97%{
opacity:0;
}

}


.rain{
position:absolute;
width:100%;
height:100%;
background-image:
linear-gradient(120deg,transparent 45%,rgba(255,255,255,.3) 50%,transparent 55%);
background-size:20px 40px;
animation:rain .5s linear infinite;
opacity:.4;
}


@keyframes rain{

from{
background-position:0 0;
}

to{
background-position:-20px 40px;
}

}



h1{
margin-top:60px;
font-size:40px;
}


.date{
font-size:28px;
color:#ffd6e7;
}



.envelope{

width:320px;
height:210px;
background:#1c1c2e;
margin:50px auto;
border-radius:15px;

box-shadow:
0 0 40px rgba(255,255,255,.2);

position:relative;
overflow:hidden;

}



.envelope:before{

content:"";

position:absolute;

border-left:160px solid transparent;
border-right:160px solid transparent;
border-top:110px solid #343450;

}



.message{

position:absolute;
top:70px;
width:100%;
padding:10px;

font-size:24px;
z-index:2;

}



button{

padding:18px 40px;

border:none;

border-radius:40px;

background:#d63384;

color:white;

font-size:24px;

cursor:pointer;

box-shadow:0 0 20px pink;

}



button:hover{

transform:scale(1.05);

}


</style>

</head>


<body>


<div class="sky"></div>

<div class="flash"></div>

<div class="rain"></div>



<audio id="thunder" autoplay loop>

<source src="ozarnikru-raskat-groma.mp3" type="audio/mpeg">

</audio>



<div id="scene">


<h1>
Наша история ❤️
</h1>


<div class="date">

04.10.2023<br>

День, который изменил всё...

</div>



<div class="envelope">

<div class="message">

Мне нужно сказать тебе<br>
что-то важное......

</div>

</div>



<button onclick="openLetter()">

💌 Открыть письмо

</button>


</div>




<script>


let sound=document.getElementById("thunder");


document.body.addEventListener("click",()=>{

sound.play();

});



function openLetter(){


document.body.style.transition="3s";

document.body.style.background="#fff1f7";


document.getElementById("scene").innerHTML=`

<h1 style="color:#d63384">

✨ Наша история продолжается ✨

</h1>


<div style="
font-size:70px;
">

🌹💌🌹

</div>


<h2 style="color:#9b2855">

Скоро здесь появится наше письмо ❤️

</h2>


`;

}


</script>


</body>
</html>
