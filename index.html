<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Love</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}


.container{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.photo{

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    animation:show 3s ease forwards;

}


@keyframes show{

0%{
    opacity:0;
    transform:scale(1.15);
}


100%{
    opacity:1;
    transform:scale(1);
}

}


</style>

</head>


<body>


<div class="container">

<img class="photo" src="IMG_0897.jpeg">

</div>


</body>
</html>
