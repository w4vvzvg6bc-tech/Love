width, initial-scale=1.0">

<title>Для любимого ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6);
    overflow-x: hidden;
    text-align: center;
    color: #9b2855;
}

body::before {
    content: "❤️ ❤️ ❤️ ❤️ ❤️";
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    font-size: 35px;
    opacity: 0.15;
    animation: float 5s infinite;
}

h1 {
    margin-top: 60px;
    font-size: 45px;
    color: #d63384;
}

.subtitle {
    font-size: 24px;
    margin-bottom: 40px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
}

button {
    width: 300px;
    height: 150px;
    border-radius: 25px;
    border: none;
    color: white;
    font-size: 32px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
}

.love {
    background: linear-gradient(135deg,#ff69b4,#ff1493);
}

.no {
    background: linear-gradient(135deg,#ff3333,#b30000);
}

.card {
    display: none;
    margin: 50px auto;
    background: white;
    width: 80%;
    max-width: 600px;
    padding: 40px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    animation: show 0.6s;
}

.card h2 {
    font-size: 38px;
    color:#d63384;
}

.card img {
    width:250px;
    border-radius:20px;
}

.catText {
    color:#cc0000;
    font-size:40px;
    font-weight:bold;
}

@keyframes show {
    from {
        opacity:0;
        transform:translateY(50px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float {
    50% {
        transform:translateY(20px);
    }
}

</style>
</head>


<body>

<h1>Привет, любимый! ❤️</h1>

<div class="subtitle">
У меня для тебя вопрос... сделай выбор 😉
</div>


<div class="buttons">

<button class="love" onclick="love()">
Нажми меня 💕
</button>


<button class="no" onclick="noLove()">
Не нажимай меня 😈
</button>

</div>



<div id="loveCard" class="card">

<h2>
Я люблю тебя ❤️
</h2>

<p style="font-size:30px;">
Когда повышение ЗП? 😘
</p>

💕💕💕

</div>



<div id="noCard" class="card">

<img src="cat.jpg">

<div class="catText">
Что хотели?!? 😂
</div>

</div>



<script>

function love(){

document.getElementById("loveCard").style.display="block";

document.getElementById("noCard").style.display="none";

}


function noLove(){

document.getElementById("noCard").style.display="block";

document.getElementById("loveCard").style.display="none";

}

</script>


</body>
</html>
