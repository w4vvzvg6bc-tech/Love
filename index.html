<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Это ты 😂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;
font-family:Arial, sans-serif;

}


.background{

position:absolute;
width:100%;
height:100%;

background:url("IMG_0897.jpeg") center/cover no-repeat;

}



.title{

position:absolute;

top:40px;

width:100%;

text-align:center;

font-size:70px;

font-weight:bold;

color:white;

text-shadow:
0 5px 20px black;

animation:show 2s;


}


@keyframes show{

from{
opacity:0;
transform:translateY(-30px);
}

to{
opacity:1;
}

}



/* мартышка */

.monkey{

position:absolute;

right:8%;

bottom:5%;

width:420px;

opacity:0;

}


.monkey.show{

animation:monkeyIn 1.5s forwards;

}


@keyframes monkeyIn{


0%{

opacity:0;

transform:
translateX(300px)
scale(.5);

}


70%{

transform:
translateX(-20px)
scale(1.1);

}


100%{

opacity:1;

transform:
translateX(0)
scale(1);

}

}



/* кот */

.cat{

position:absolute;

left:8%;

bottom:5%;

width:350px;

opacity:0;

}



.cat.show{

animation:catIn 1.5s forwards;

}



@keyframes catIn{


from{

opacity:0;

transform:
translateY(300px);

}


to{

opacity:1;

transform:
translateY(0);

}

}



/* подписи */

.text{

position:absolute;

width:100%;

bottom:85%;

text-align:center;

font-size:45px;

color:white;

font-weight:bold;

text-shadow:
0 5px 15px black;

}



.catText{

position:absolute;

bottom:30px;

left:0;

width:100%;

text-align:center;

font-size:45px;

color:white;

font-weight:bold;

text-shadow:
0 5px 15px black;

opacity:0;

}



.catText.show{

opacity:1;

animation:show 1s;

}


</style>

</head>


<body>


<div class="background"></div>


<div class="title">

Я тебя так вижу 😂

</div>



<img 
src="1F6CCEBF-BE7C-4DA8-BAF6-85FB6D24DD93.gif"
class="monkey"
id="monkey">


<img 
src="853BF6E2-1664-4CD2-BC84-076CB1B52672.gif"
class="cat"
id="cat">



<div class="catText" id="catText">

Это когда тебя Даня не понимает 😂

</div>



<script>


setTimeout(()=>{

document
.getElementById("monkey")
.classList.add("show");


},5000);



setTimeout(()=>{


document
.getElementById("cat")
.classList.add("show");


document
.getElementById("catText")
.classList.add("show");


},8000);



</script>


</body>
</html>
