<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Это ты 😂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{
width:100vw;
height:100vh;
overflow:hidden;
font-family:Arial, sans-serif;
}


/* ФОН */

.background{

position:absolute;
width:100%;
height:100%;

background-image:url("IMG_0897.jpeg");
background-size:cover;
background-position:center;

}



/* верхняя надпись */

.mainText{

position:absolute;

top:40px;

width:100%;

text-align:center;

font-size:60px;

font-weight:bold;

color:white;

text-shadow:0 5px 20px black;

}



/* МАРТЫШКА */

.monkey{

position:absolute;

right:10%;

bottom:80px;

width:420px;

opacity:0;

transform:translateX(300px) scale(.7);

transition:1.5s;

z-index:5;

}


.monkey.show{

opacity:1;

transform:translateX(0) scale(1);

}



/* КОТ */

.cat{

position:absolute;

right:10%;

bottom:80px;

width:420px;

opacity:0;

transform:scale(.7);

transition:1.5s;

z-index:5;

}


.cat.show{

opacity:1;

transform:scale(1);

}



/* подпись мартышки */

.monkeyText{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

font-size:50px;

font-weight:bold;

color:white;

text-shadow:0 5px 20px black;

opacity:0;

transition:1s;

z-index:10;

}



.monkeyText.show{

opacity:1;

}



/* подпись кота */

.catText{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

font-size:50px;

font-weight:bold;

color:white;

text-shadow:0 5px 20px black;

opacity:0;

transition:1s;

z-index:10;

}



.catText.show{

opacity:1;

}



/* лёгкая тряска */

@keyframes shake{

0%{transform:translateX(0)}

25%{transform:translateX(-10px)}

50%{transform:translateX(10px)}

75%{transform:translateX(-10px)}

100%{transform:translateX(0)}

}


</style>

</head>


<body>


<div class="background"></div>



<div class="mainText">

Я тебя так вижу 😂

</div>



<img 
id="monkey"
class="monkey"
src="1F6CCEBF-BE7C-4DA8-BAF6-85FB6D24DD93.gif">



<img 
id="cat"
class="cat"
src="853BF6E2-1664-4CD2-BC84-076CB1B52672.gif">



<div 
id="monkeyText"
class="monkeyText">

Я тебя так вижу 😂

</div>



<div 
id="catText"
class="catText">

А это ты 😂

</div>



<script>


let monkey=document.getElementById("monkey");

let cat=document.getElementById("cat");

let monkeyText=document.getElementById("monkeyText");

let catText=document.getElementById("catText");



// через 5 секунд появляется мартышка

setTimeout(()=>{

monkey.classList.add("show");

monkeyText.classList.add("show");


},5000);



// через 10 секунд мартышка исчезает, кот появляется

setTimeout(()=>{


monkey.classList.remove("show");

monkeyText.classList.remove("show");



setTimeout(()=>{


cat.classList.add("show");

catText.classList.add("show");


},1000);



},10000);



</script>


</body>
</html>
