<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Это ты 😂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;
font-family:Georgia,serif;
background:black;

}


/* ФОН */

.background{

position:absolute;
inset:0;

background:url("background.jpg") center/cover;

animation:zoom 15s infinite alternate;

}


@keyframes zoom{

from{
transform:scale(1);
}

to{
transform:scale(1.1);
}

}


/* затемнение */

.dark{

position:absolute;
inset:0;

background:
linear-gradient(
rgba(0,0,0,.15),
rgba(0,0,0,.5)
);

}



/* текст */

.text{

position:absolute;

top:40%;

width:100%;

text-align:center;

color:white;

font-size:60px;

letter-spacing:3px;

text-shadow:
0 0 20px black;

animation:appear 2s;


}



@keyframes appear{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
}

}



/* обезьяна */

.monkey{

position:absolute;

right:10%;

bottom:5%;

width:420px;

opacity:0;

transform:scale(.5);

transition:2s;

filter:drop-shadow(0 0 30px black);

}



.monkey.show{

opacity:1;

transform:scale(1);

}



/* кот */

.cat{

position:absolute;

left:10%;

bottom:5%;

width:350px;

opacity:0;

transform:translateY(100px);

transition:2s;

}



.cat.show{

opacity:1;

transform:translateY(0);

}



/* финальный текст */

.final{

position:absolute;

top:15%;

width:100%;

text-align:center;

color:white;

font-size:55px;

opacity:0;

transition:3s;

text-shadow:
0 0 30px pink;

}


.final.show{

opacity:1;

}


</style>

</head>


<body>


<div class="background"></div>

<div class="dark"></div>


<div class="text" id="text">

Так я тебя вижу<br>
на работе 😂

</div>



<img 
class="monkey"
id="monkey"
src="monkey.gif">



<img 
class="cat"
id="cat"
src="cat.gif">



<div 
class="final"
id="final">

Но всё равно люблю тебя ❤️

</div>



<script>


let text=document.getElementById("text");

let monkey=document.getElementById("monkey");

let cat=document.getElementById("cat");

let final=document.getElementById("final");



// через 5 секунд обезьяна

setTimeout(()=>{


text.innerHTML="А вот как ты реально работаешь 😂";


monkey.classList.add("show");


},5000);



// через 8 секунд кот


setTimeout(()=>{


cat.classList.add("show");


text.innerHTML="И я всё это вижу... 😼";


},8000);



// через 12 секунд


setTimeout(()=>{


final.classList.add("show");


},12000);



</script>


</body>

</html>
